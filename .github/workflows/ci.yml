name: CI/CD

on:
  push:
    branches:
     - main

  pull_request:
    branches:
     - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps: 
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Set up Python
       uses: actions/setup-python@v5
       with:
         python-version: "3.12"

     - name: Install dependencies
       run: pip install -r requirements.txt

     - name: Run tests
       run: python -m pytest

     - name: Log in to Docker Hub
       uses: docker/login-action@v3
       with:
         username: ${{ secrets.DOCKERHUB_ANAMARIJAKRSTESKA}}
         password: ${{ secrets.DOCKERHUB_TOKEN}}

     - name: Build Docker image
       run: docker build -t anamarijakrsteska/docker-system-monitor-api:latest .

     - name: Push Docker image
       run: docker push anamarijakrsteska/docker-system-monitor-api:latest